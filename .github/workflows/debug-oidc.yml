name: debug-oidc

# 临时诊断：`npm publish` 在 OIDC 这条路上只报 ENEEDAUTH，把真正的拒绝原因吞掉了。
# 这里直接问 registry 要 token，把 HTTP 状态和响应体打出来，用来判断是关系没配上、
# 还是 workflow 文件名/权限不匹配。跑完就删。

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  exchange:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: request an id token from GitHub
        run: |
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]]; then
            echo "::error::ACTIONS_ID_TOKEN_REQUEST_URL 为空 —— 这个 job 没有拿到 id-token 权限"
            exit 1
          fi
          echo "request url present: yes"
          token=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" | jq -r .value)
          if [[ -z "$token" || "$token" == "null" ]]; then
            echo "::error::没能取到 id token"
            exit 1
          fi
          echo "id token length: ${#token}"
          for pkg in dsh-fairy-next dsh-fairy-contracts; do
            echo "--- $pkg ---"
            code=$(curl -sS -o /tmp/body.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $token" \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$pkg")
            echo "status: $code"
            jq -r 'if .token then "token: ok, length \(.token | length)" else . end' /tmp/body.json 2>/dev/null || cat /tmp/body.json
          done
