name: publish-npm

# 七个包一起发到 npmjs。触发方式是打 tag（真发）或手动跑（默认只 dry-run）。
# 这里不碰 CNB：镜像由 CNB 侧 .cnb.yml 的 pull 完成，本工作流不推任何远端仓库。
#
# 发的是 `pack-all` 打出来的 tarball，不是包目录。这样本地
# `node tools/pack-all.mjs --install-test` 验过的字节，就是 registry 上收到的字节。
#
# 身份只走 OIDC（Trusted Publisher）：仓库里没有任何 npm 凭据 secret，也就
# 没有可泄漏、可忘记轮换的东西。七个包的关系用 `node tools/trust-publisher.mjs`
# 一次配好（每包一条，漏配的那个会在发布时以 ENEEDAUTH 失败）。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只跑 npm publish --dry-run，不真的发布
        type: boolean
        default: true

permissions:
  contents: write # 打 tag 的那次要建 GitHub Release（附七个 tarball）
  # OIDC：npm 用这份短时身份换发布令牌（Trusted Publisher）。
  id-token: write

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          # Trusted publishing 要求 npm >= 11.5.1（Node 22 自带的是 npm 10，
          # 换不到 OIDC 令牌），Node 24 自带 npm 11，所以这里用 24。
          # 不设 registry-url：那会在 .npmrc 写一行 _authToken=${NODE_AUTH_TOKEN}，
          # 而 OIDC 这条路上那个变量必须是空的，否则 npm 会拿它去认证。
          node-version: 24
          cache: pnpm

      - name: check the npm CLI
        run: |
          node --version
          npm --version
          npm config get registry

      # .npmrc 里必须没有任何 _authToken，npm 才会去换 OIDC 令牌。多一层断言，
      # 免得将来有人为了图快又把 token 塞回 secret + .npmrc。
      - name: assert there is no static npm token
        run: |
          if npm config get '//registry.npmjs.org/:_authToken' | grep -qv '^undefined$'; then
            echo "::error::.npmrc 里出现了 _authToken，OIDC 会被绕过，发布身份不再来自工作流"
            exit 1
          fi
          echo "no static token configured"

      - run: pnpm install --frozen-lockfile

      # 元数据审计：只打印每个包最终会发哪些文件，不写盘。
      - name: audit manifests
        run: node tools/prepare-publish.mjs --dry

      # 把 dev 用的 link:/workspace: 依赖改写成版本范围；当前清单已是范围，这一步是幂等的。
      - name: pin dependency ranges
        run: |
          node tools/pin-versions.mjs
          git --no-pager diff --stat -- packages || true

      - run: node tools/build-all.mjs

      - run: node tools/verify-build.mjs

      # 产物清单写到 .dsh-market-home/pkgs/pack-manifest.json；--json 顺便打进日志。
      - name: pack the seven tarballs
        run: node tools/pack-all.mjs --json

      - name: compare the tag with the packed version
        if: github.ref_type == 'tag'
        run: |
          version=$(node -p "require('./packages/dsh-fairy-next/package.json').version")
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::warning::tag $GITHUB_REF_NAME 与锚包版本 $version 不一致，版本以 package.json 为准"
          fi

      # 已有 name@version 的包会被 publish-npm.mjs 跳过，所以重复触发是安全的。
      - name: publish
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" == "true" ]]; then
            node tools/publish-npm.mjs --dry-run
          else
            node tools/publish-npm.mjs
          fi

      # npm 上的版本与 tag 是两套账：registry 有了不代表仓库有 release 页。
      # 打的 tarball 就是刚发出去的那七个字节，挂上去让不装 npm 的人也能直接下。
      - name: create the GitHub release
        if: github.ref_type == 'tag' && env.DRY_RUN != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME 已存在，跳过"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            .dsh-market-home/pkgs/*.tgz \
            --title "dsh-fairy-next $GITHUB_REF_NAME" \
            --generate-notes
