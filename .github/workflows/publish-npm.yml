name: publish-npm

# 七个包一起发到 npmjs。触发方式是打 tag（真发）或手动跑（默认只 dry-run）。
# 这里不碰 CNB：镜像由 CNB 侧 .cnb.yml 的 pull 完成，本工作流不推任何远端仓库。
#
# 发的是 `pack-all` 打出来的 tarball，不是包目录。这样本地
# `node tools/pack-all.mjs --install-test` 验过的字节，就是 registry 上收到的字节。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只跑 npm publish --dry-run，不真的发布
        type: boolean
        default: true

permissions:
  contents: read
  # provenance 需要把这份构建的 OIDC 身份交给 npm
  id-token: write

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 要么在仓库 Secrets 里放 NPM_TOKEN（细粒度 token，勾 bypass 2FA），
      # 要么在 npmjs 上给每个包配好 Trusted Publisher 走 OIDC——后者不需要 token。
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          # pnpm 11.28.5 自己要求 Node >= 22.13，所以这里不钉 22.12.0，跟随 22.x 最新
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 元数据审计：只打印每个包最终会发哪些文件，不写盘。
      - name: audit manifests
        run: node tools/prepare-publish.mjs --dry

      # 把 dev 用的 link:/workspace: 依赖改写成版本范围；当前清单已是范围，这一步是幂等的。
      - name: pin dependency ranges
        run: |
          node tools/pin-versions.mjs
          git --no-pager diff --stat -- packages || true

      - run: node tools/build-all.mjs

      - run: node tools/verify-build.mjs

      # 产物清单写到 .dsh-market-home/pkgs/pack-manifest.json；--json 顺便打进日志。
      - name: pack the seven tarballs
        run: node tools/pack-all.mjs --json

      - name: compare the tag with the packed version
        if: github.ref_type == 'tag'
        run: |
          version=$(node -p "require('./packages/dsh-fairy-next/package.json').version")
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::warning::tag $GITHUB_REF_NAME 与锚包版本 $version 不一致，版本以 package.json 为准"
          fi

      # 已有 name@version 的包会被 publish-npm.mjs 跳过，所以重复触发是安全的。
      - name: publish
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" == "true" ]]; then
            node tools/publish-npm.mjs --dry-run
          else
            node tools/publish-npm.mjs
          fi
