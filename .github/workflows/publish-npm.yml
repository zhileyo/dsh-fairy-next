name: publish-npm

# 七个包一起发到 npmjs。触发方式是打 tag（真发）或手动跑（默认只 dry-run）。
# 这里不碰 CNB：镜像由 CNB 侧 .cnb.yml 的 pull 完成，本工作流不推任何远端仓库。
#
# 发的是 `pack-all` 打出来的 tarball，不是包目录。这样本地
# `node tools/pack-all.mjs --install-test` 验过的字节，就是 registry 上收到的字节。
#
# 首次引导：Trusted Publisher 只能挂在已经存在的包上，而账号开了 2FA
# （auth-and-writes）时 `npm trust` 的创建路径不送 OTP，CLI 一律 E403。
# 所以首版要用仓库里的 NPM_TOKEN secret 发一次，发完在网页上给七个包建
# Trusted Publisher，再删掉 secret 与下面那个引导步骤——之后只剩 OIDC。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 只跑 npm publish --dry-run，不真的发布
        type: boolean
        default: true
      bootstrap_token:
        description: 用仓库 secret NPM_TOKEN 发首版（建好 Trusted Publisher 后不要再开）
        type: boolean
        default: false

permissions:
  contents: read
  # OIDC：npm 用这份短时身份换发布令牌（Trusted Publisher），
  # 所以仓库里不存 NPM_TOKEN，也就没有可泄漏、可忘记轮换的东西。
  id-token: write

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 走 OIDC，不需要任何凭据 secret；七个包的 Trusted Publisher 用
      # `node tools/trust-publisher.mjs` 一次配好（配完 2 天内要完成首次发布）。
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          # Trusted publishing 要求 npm >= 11.5.1（Node 22 自带的是 npm 10，
          # 换不到 OIDC 令牌），Node 24 自带 npm 11，所以这里用 24。
          # 不设 registry-url：那会在 .npmrc 写一行 _authToken=${NODE_AUTH_TOKEN}，
          # 而 OIDC 这条路上那个变量必须是空的，否则 npm 会拿它去认证。
          node-version: 24
          cache: pnpm

      - name: check the npm CLI
        run: |
          node --version
          npm --version
          npm config get registry

      # 只在首版引导时把 token 写进 .npmrc。平时这一步不跑，.npmrc 里没有
      # 任何 _authToken，npm 才会去换 OIDC 令牌。
      - name: authenticate with the bootstrap token
        if: inputs.bootstrap_token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "$NPM_TOKEN" ]]; then
            echo "::error::bootstrap_token 打开了，但仓库里没有 NPM_TOKEN secret"
            exit 1
          fi
          npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN" --location=user
          npm whoami

      - run: pnpm install --frozen-lockfile

      # 元数据审计：只打印每个包最终会发哪些文件，不写盘。
      - name: audit manifests
        run: node tools/prepare-publish.mjs --dry

      # 把 dev 用的 link:/workspace: 依赖改写成版本范围；当前清单已是范围，这一步是幂等的。
      - name: pin dependency ranges
        run: |
          node tools/pin-versions.mjs
          git --no-pager diff --stat -- packages || true

      - run: node tools/build-all.mjs

      - run: node tools/verify-build.mjs

      # 产物清单写到 .dsh-market-home/pkgs/pack-manifest.json；--json 顺便打进日志。
      - name: pack the seven tarballs
        run: node tools/pack-all.mjs --json

      - name: compare the tag with the packed version
        if: github.ref_type == 'tag'
        run: |
          version=$(node -p "require('./packages/dsh-fairy-next/package.json').version")
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::warning::tag $GITHUB_REF_NAME 与锚包版本 $version 不一致，版本以 package.json 为准"
          fi

      # 已有 name@version 的包会被 publish-npm.mjs 跳过，所以重复触发是安全的。
      - name: publish
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" == "true" ]]; then
            node tools/publish-npm.mjs --dry-run
          else
            node tools/publish-npm.mjs
          fi
